name: OS4 - Transcrever
run-name: Transcrever ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL do vídeo no YouTube"
        required: true
      request_id:
        description: "ID interno do processamento"
        required: true
      callback_url:
        description: "Callback de progresso"
        required: true

permissions:
  contents: read

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      OS4_REQUEST_ID: ${{ inputs.request_id }}
      OS4_PROGRESS_URL: ${{ inputs.callback_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-${{ runner.os }}-v1
          restore-keys: |
            whisper-small-${{ runner.os }}-

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Instalar Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar e iniciar PO Token do YouTube
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/bgutil-ytdlp-pot-provider"
          git clone --depth 1 --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

          nohup node build/main.js > "$RUNNER_TEMP/bgutil-pot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bgutil-pot.pid"

          pronto=0
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              pronto=1
              break
            fi
            sleep 1
          done

          if [ "$pronto" != "1" ]; then
            echo "Servidor PO Token não iniciou corretamente."
            cat "$RUNNER_TEMP/bgutil-pot.log" || true
            exit 1
          fi

          echo "YTDLP_USE_POT=1" >> "$GITHUB_ENV"

      - name: Preparar cookies do YouTube
        shell: bash
        run: |
          mkdir -p .work
          if [ -n "${YOUTUBE_COOKIES_B64:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > .work/cookies.txt
            chmod 600 .work/cookies.txt
            echo "YOUTUBE_COOKIES=$GITHUB_WORKSPACE/.work/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies.txt configurado como fallback."
          else
            echo "Sem cookies configurados."
          fi

      - name: Baixar, transcrever e salvar sessão
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python -m processor.prepare \
            --url "$VIDEO_URL" \
            --request-id "$OS4_REQUEST_ID" \
            --workdir ".work"

      - name: Guardar transcrição por 1 dia
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: os4-transcricao-${{ inputs.request_id }}
          path: |
            .work/transcricao_para_chatgpt.txt
            .work/transcricao.json
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn

      - name: Reportar falha ao front
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          url = os.environ.get("OS4_PROGRESS_URL", "")
          rid = os.environ.get("OS4_REQUEST_ID", "")
          secret = os.environ.get("GOOGLE_CLIENT_SECRET", "")
          if url and rid and secret:
              token = hmac.new(secret.encode(), f"os4-progress:{rid}".encode(), hashlib.sha256).hexdigest()
              payload = json.dumps({
                  "request_id": rid,
                  "token": token,
                  "status": "error",
                  "stage": "erro",
                  "percent": 100,
                  "detail": "O processamento falhou no GitHub Actions. Veja o log se precisar de detalhes.",
                  "error": "Falha no workflow de transcrição"
              }).encode("utf-8")
              try:
                  urllib.request.urlopen(urllib.request.Request(url, data=payload, method="POST", headers={"Content-Type":"application/json"}), timeout=8).read()
              except Exception as exc:
                  print(f"Não foi possível reportar a falha: {exc}")
          PY
