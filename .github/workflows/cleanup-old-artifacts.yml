name: Limpar storage do GitHub Actions

on:
  push:
    paths:
      - ".github/workflows/cleanup-old-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Limpar artifacts antigos e caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/artifacts?per_page=100" > /tmp/artifact-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/caches?per_page=100" > /tmp/cache-pages.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["REPOSITORY"]

          def load_pages(path, field):
              with open(path, "r", encoding="utf-8") as fh:
                  pages = json.load(fh)
              items = []
              for page in pages:
                  items.extend(page.get(field, []))
              return items

          artifacts = load_pages("/tmp/artifact-pages.json", "artifacts")
          caches = load_pages("/tmp/cache-pages.json", "actions_caches")

          by_name = defaultdict(list)
          for artifact in artifacts:
              by_name[artifact["name"]].append(artifact)

          preserved_artifacts = []
          old_artifacts = []
          for name, items in by_name.items():
              ordered = sorted(items, key=lambda item: item.get("created_at") or "", reverse=True)
              preserved_artifacts.append(ordered[0])
              old_artifacts.extend(ordered[1:])

          deleted_artifacts = []
          failed_artifacts = []
          for artifact in old_artifacts:
              try:
                  subprocess.run(
                      ["gh", "api", "--method", "DELETE",
                       f"/repos/{repo}/actions/artifacts/{artifact['id']}"],
                      check=True,
                  )
                  deleted_artifacts.append(artifact)
              except subprocess.CalledProcessError:
                  failed_artifacts.append(artifact)

          deleted_caches = []
          failed_caches = []
          for cache in caches:
              try:
                  subprocess.run(
                      ["gh", "api", "--method", "DELETE",
                       f"/repos/{repo}/actions/caches/{cache['id']}"],
                      check=True,
                  )
                  deleted_caches.append(cache)
              except subprocess.CalledProcessError:
                  failed_caches.append(cache)

          def mb(value):
              return value / 1024 / 1024

          artifact_freed = sum(item.get("size_in_bytes", 0) for item in deleted_artifacts)
          cache_freed = sum(item.get("size_in_bytes", 0) for item in deleted_caches)
          total_freed = artifact_freed + cache_freed
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          lines = [
              "# Relatório de limpeza do GitHub Actions",
              "",
              f"Repositório: `{repo}`",
              f"Executado em: {now}",
              "",
              "## Resultado",
              "",
              f"Artifacts encontrados: **{len(artifacts)}**",
              f"Artifacts antigos apagados: **{len(deleted_artifacts)}**",
              f"Caches encontrados: **{len(caches)}**",
              f"Caches apagados: **{len(deleted_caches)}**",
              f"Espaço removido: **{mb(total_freed):.2f} MB**",
              "",
              "## Artifacts preservados",
              "",
          ]

          if preserved_artifacts:
              for item in sorted(preserved_artifacts, key=lambda x: x["name"].lower()):
                  lines.append(
                      f"- {item['name']} | {mb(item.get('size_in_bytes', 0)):.2f} MB | "
                      f"{item.get('created_at', 'sem data')}"
                  )
          else:
              lines.append("- Nenhum.")

          lines += ["", "## Caches apagados", ""]
          if deleted_caches:
              for item in deleted_caches:
                  lines.append(
                      f"- {item.get('key', 'sem chave')} | "
                      f"{mb(item.get('size_in_bytes', 0)):.2f} MB | "
                      f"{item.get('last_accessed_at', 'sem data')}"
                  )
          else:
              lines.append("- Nenhum.")

          if failed_artifacts or failed_caches:
              lines += ["", "## Falhas", ""]
              for item in failed_artifacts:
                  lines.append(f"- Artifact {item['name']} (id {item['id']})")
              for item in failed_caches:
                  lines.append(f"- Cache {item.get('key', 'sem chave')} (id {item['id']})")

          Path("artifact-cleanup-report.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Registrar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact-cleanup-report.md
          if git diff --cached --quiet; then
            echo "Relatório sem alterações."
          else
            git commit -m "chore: report Actions storage cleanup"
            git push
          fi
