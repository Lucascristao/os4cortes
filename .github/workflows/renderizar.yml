name: OS4 - Gerar cortes
run-name: Gerar cortes ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID interno do processamento"
        required: true
      folder_id:
        description: "Pasta da sessão no Google Drive"
        required: true
      video_file_id:
        description: "Arquivo-base no Google Drive"
        required: true
      transcript_json_file_id:
        description: "Transcrição estruturada no Google Drive"
        required: true
      cuts_json:
        description: "Pacote JSON dos cortes"
        required: true
      callback_url:
        description: "Callback de progresso"
        required: true
      lower_third_mode:
        description: "Tratamento da tarja na origem"
        required: false
        default: "off"
      lower_third_height:
        description: "Fração da altura da tarja na origem"
        required: false
        default: "0"
      cut_mode:
        description: "Modelo: editorial com narração ou simple legado"
        required: false
        default: "simple"
      burn_captions:
        description: "Queimar legendas no vídeo"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      OS4_REQUEST_ID: ${{ inputs.request_id }}
      OS4_PROGRESS_URL: ${{ inputs.callback_url }}
      OS4_FOLDER_ID: ${{ inputs.folder_id }}
      OS4_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      OS4_TRANSCRIPT_JSON_FILE_ID: ${{ inputs.transcript_json_file_id }}
      OS4_CUTS_JSON: ${{ inputs.cuts_json }}
      OS4_LOWER_THIRD_MODE: ${{ inputs.lower_third_mode }}
      OS4_LOWER_THIRD_HEIGHT: ${{ inputs.lower_third_height }}
      OS4_CUT_MODE: ${{ inputs.cut_mode }}
      OS4_BURN_CAPTIONS: ${{ inputs.burn_captions }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-render.txt

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Gerar todos os cortes
        run: |
          python -m processor.render_batch \
            --request-id "$OS4_REQUEST_ID" \
            --folder-id "$OS4_FOLDER_ID" \
            --video-file-id "$OS4_VIDEO_FILE_ID" \
            --transcript-json-file-id "$OS4_TRANSCRIPT_JSON_FILE_ID" \
            --cuts-json "$OS4_CUTS_JSON" \
            --lower-third-mode "$OS4_LOWER_THIRD_MODE" \
            --lower-third-height "$OS4_LOWER_THIRD_HEIGHT" \
            --cut-mode "$OS4_CUT_MODE" \
            --burn-captions "$OS4_BURN_CAPTIONS" \
            --workdir ".work" \
            --output "output"

      - name: Reportar falha ao front
        if: failure() || cancelled()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          from pathlib import Path
          url = os.environ.get("OS4_PROGRESS_URL", "")
          rid = os.environ.get("OS4_REQUEST_ID", "")
          secret = os.environ.get("GOOGLE_CLIENT_SECRET", "")
          if url and rid and secret:
              token = hmac.new(secret.encode(), f"os4-progress:{rid}".encode(), hashlib.sha256).hexdigest()
              result_path = Path("output/render-batch-result.json")
              result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.is_file() else None
              detail = "A geração dos cortes falhou no GitHub Actions."
              percent = 0
              error = "Falha no workflow de geração de cortes"
              if result:
                  saved = result.get('completedCount', 0)
                  requested = result.get('requestedCount', 0)
                  detail = f"{saved}/{requested} cortes salvos; {len(result.get('errors', []))} falhou/falharam."
                  percent = 10 + 85 * saved / requested if requested else 0
                  error = result.get('stoppedReason') or (result.get('errors') or [{}])[-1].get('error') or detail
              payload = json.dumps({
                  "request_id": rid,
                  "token": token,
                  "status": "cancelled" if "${{ job.status }}" == "cancelled" else "error",
                  "stage": "erro",
                  "percent": percent,
                  "detail": detail,
                  "error": error,
                  **({"result": result} if result else {})
              }).encode("utf-8")
              try:
                  urllib.request.urlopen(urllib.request.Request(url, data=payload, method="POST", headers={"Content-Type":"application/json"}), timeout=8).read()
              except Exception as exc:
                  print(f"Não foi possível reportar a falha: {exc}")
          PY

      - name: Preservar relatório de cortes e falhas
        if: ${{ always() && hashFiles('output/render-batch-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: resultado-cortes-${{ inputs.request_id }}
          path: output/render-batch-result.json
          retention-days: 1
