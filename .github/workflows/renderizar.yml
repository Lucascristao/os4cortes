name: OS4 - Prova isolada de narração autoral
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voz-autoral:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências de voz e alinhamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'google-genai==2.26.0' 'num2words>=0.5.14,<0.6' 'faster-whisper>=1.2,<2'
      - name: Gerar somente a voz literal do piloto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m processor.editorial_voice --plan .os4-preview/editorial-plan.json --output-dir .os4-preview/audio
      - name: Alinhar palavras canônicas
        run: python -m processor.editorial_alignment --audio-dir .os4-preview/audio
      - name: Guardar áudio e diagnóstico do piloto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os4-roberta-grave-preview
          path: .os4-preview/audio/
          if-no-files-found: error
          retention-days: 7
