name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validar API e integração
        run: |
          npm ci --ignore-scripts
          npm test
          node --check web/app.js
          node --check web/sw.js

      - name: Validar Python
        run: |
          python -m compileall processor

      - name: Validar arquivos PWA
        run: |
          test -f web/index.html
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f netlify.toml
          python - <<'PY'
          import json
          json.load(open('web/manifest.webmanifest', encoding='utf-8'))
          print('Manifesto válido')
          PY
