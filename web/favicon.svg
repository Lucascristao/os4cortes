<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c15"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe676"/>
      <stop offset="45%" stop-color="#ffc928"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffe169"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#ffc928" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo do Ícone -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#362f1b" stroke-width="8"/>

  <!-- Moldura Vertical 9:16 (Cortes Verticais) -->
  <rect x="156" y="80" width="200" height="352" rx="36" fill="none" stroke="url(#gold)" stroke-width="26" filter="url(#glow)"/>

  <!-- Play centralizado -->
  <path d="M236 210 L304 256 L236 302 Z" fill="url(#gold)"/>

  <!-- Linha diagonal dinâmica de corte -->
  <path d="M100 356 L412 156" stroke="url(#blade)" stroke-width="24" stroke-linecap="round"/>

  <!-- Marcas de corte superior e inferior -->
  <circle cx="100" cy="356" r="14" fill="#ffffff"/>
  <circle cx="412" cy="156" r="14" fill="#ffc928"/>
</svg>
